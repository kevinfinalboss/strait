[package]
name = "strait"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A Layer 4 load balancer written in Rust"
license = "MIT"
repository = "https://github.com/kevinfinalboss/strait"

[workspace]
# strait-ebpf only builds for the BPF target; the build script compiles it when
# the `xdp` feature is on, so plain `cargo build`/`cargo test` leave it out.
members = ["strait-common", "strait-ebpf"]
default-members = ["."]

[features]
# XDP data plane (Linux only). Needs nightly with rust-src and bpf-linker at
# build time; see "XDP data plane" in the README.
xdp = ["dep:aya", "dep:aya-build", "dep:strait-common", "strait-common/user"]

[dependencies]
aya = { version = "0.16.0", optional = true }
strait-common = { path = "strait-common", optional = true }
anyhow = "1.0.104"
arc-swap = "1.9.5"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
humantime = "2.4.0"
humantime-serde = "1.1.1"
k8s-openapi = { version = "0.29.0", features = ["v1_37"] }
kube = { version = "5", features = ["runtime"] }
notify = "8"
prometheus-client = "0.26.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[[example]]
name = "xdp_pass"
required-features = ["xdp"]

[build-dependencies]
aya-build = { version = "0.2.1", optional = true }

[profile.release.package.strait-ebpf]
debug = 2
codegen-units = 1
